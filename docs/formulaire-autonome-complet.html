      var copie = {};
      Object.keys(valeurs).forEach(function (k) { if (k !== 'photos') copie[k] = valeurs[k]; });
      localStorage.setItem(CLE_BROUILLON, JSON.stringify({ valeurs: copie, index: index }));
    } catch (e) { /* ignoré */ }
  }

  /* ---------------- Aides ---------------- */
  function visible(champ) {
    if (!champ.showIf) return true;
    var actuel = valeurs[champ.showIf.field];
    if (Array.isArray(actuel)) return actuel.indexOf(champ.showIf.equals) !== -1;
    return actuel === champ.showIf.equals;
  }

  function ageDepuis(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
    if (!m) return null;
    var a = +m[1], mo = +m[2], j = +m[3];
    var d = new Date(Date.UTC(a, mo - 1, j));
    if (d.getUTCFullYear() !== a || d.getUTCMonth() !== mo - 1 || d.getUTCDate() !== j) return null;
    var now = new Date(), age = now.getUTCFullYear() - a;
    var passe = now.getUTCMonth() + 1 > mo || (now.getUTCMonth() + 1 === mo && now.getUTCDate() >= j);
    if (!passe) age -= 1;
    return age;
  }

  function validerEtape(etape) {
    var e = {};
    etape.fields.forEach(function (champ) {
      if (!visible(champ)) return;
      var v = valeurs[champ.name];

      if (champ.type === 'photos') {
        var pretes = (v || []).filter(function (p) { return p.statut === 'prete'; });
        if (!pretes.length) {
          e[champ.name] = (v || []).some(function (p) { return p.statut === 'attente'; })
            ? 'Patiente une seconde, la photo se prépare.'
            : 'Ajoute au moins une photo.';
        }
        return;
      }
      if (champ.type === 'multi') {
        if (champ.required && (!Array.isArray(v) || !v.length)) e[champ.name] = 'Choisis au moins une réponse.';
        return;
      }
      if (champ.type === 'consent') {
        if (champ.required && v !== true) e[champ.name] = 'Il faut accepter le règlement pour continuer.';
        return;
      }

      var t = typeof v === 'string' ? v.trim() : '';
      if (champ.required && !t) {
        e[champ.name] = (champ.type === 'radio' || champ.type === 'select')
          ? 'Choisis une réponse.' : 'Ce champ est nécessaire.';
        return;
      }
      if (!t) return;

      if (champ.minLength && t.length < champ.minLength) {
        e[champ.name] = 'Encore un peu — ' + champ.minLength + ' caractères au minimum.';
      } else if (champ.type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(t)) {
        e[champ.name] = 'Cet email ne semble pas valide.';
      } else if (champ.type === 'tel' && !/^(?:\+?\d[\d\s.\-()]{7,20})$/.test(t)) {
        e[champ.name] = 'Ce numéro ne semble pas valide.';
      } else if (champ.name === 'postalCode' && !/^\d{5}$/.test(t)) {
        e[champ.name] = 'Un code postal a 5 chiffres.';
      } else if (champ.type === 'number') {
        var n = Number(t);
        if (!isFinite(n)) e[champ.name] = 'Indique un nombre.';
        else if (champ.min !== undefined && n < champ.min) e[champ.name] = 'Au moins ' + champ.min + '.';
        else if (champ.max !== undefined && n > champ.max) e[champ.name] = 'Au plus ' + champ.max + '.';
      } else if (champ.type === 'date') {
        var age = ageDepuis(t);
        if (age === null) e[champ.name] = 'Cette date n’existe pas.';
        else if (age < 18) e[champ.name] = 'Nos soirées sont réservées aux majeurs.';
        else if (age > 99) e[champ.name] = 'Cette date ne semble pas juste.';
      }
    });
    return e;
  }

  /* ---------------- Photos ---------------- */

  /* Le HEIC est le format par défaut de l'appareil photo d'un iPhone. Safari
     sait le lire ; ni Chrome, ni Firefox, ni Android. Déposée telle quelle,
     la photo devient un carré blanc dans l'espace de curation — et la
     candidature part avec un handicap qui n'a rien à voir avec la personne.
     On la convertit donc en JPEG ici, avant l'envoi. */

  var MARQUES_HEIF = ['heic','heix','hevc','hevx','heim','heis','hevm','hevs','mif1','msf1'];
  var DECODEUR = 'https://cdn.jsdelivr.net/npm/heic-to@1.5.2/dist/iife/heic-to.js';
  var DECODEUR_SIGNATURE = 'sha384-cVm8gaWQ5+URpoh6ACKXpm8TuyoHkfIDDBkxvDoUdIZ18w8nV5en0lVQvWMwO/6S';

  /* Les douze premiers octets du fichier. Le type annoncé par le navigateur
     ne vaut rien : il est vide sur beaucoup d'Android, et faux dès que le
     fichier vient d'un gestionnaire de fichiers. */
  function signature(fichier) {
    return new Promise(function (resoudre) {
      var lecteur = new FileReader();
      lecteur.onload = function () { resoudre(new Uint8Array(lecteur.result)); };
      lecteur.onerror = function () { resoudre(new Uint8Array(0)); };
      try { lecteur.readAsArrayBuffer(fichier.slice(0, 12)); }
      catch (e) { resoudre(new Uint8Array(0)); }
    });
  }

  function lire(octets, debut, longueur) {
    var texte = '';
    for (var i = debut; i < debut + longueur && i < octets.length; i++) {
      texte += String.fromCharCode(octets[i]);
    }
    return texte;
  }

  function formatDe(octets) {
    if (octets.length < 12) return null;
    if (octets[0] === 0xff && octets[1] === 0xd8 && octets[2] === 0xff) {
      return { ext: 'jpg', mime: 'image/jpeg' };
    }
    if (octets[0] === 0x89 && lire(octets, 1, 3) === 'PNG') {
      return { ext: 'png', mime: 'image/png' };
    }
    if (lire(octets, 0, 4) === 'RIFF' && lire(octets, 8, 4) === 'WEBP') {
      return { ext: 'webp', mime: 'image/webp' };
    }
    if (lire(octets, 4, 4) === 'ftyp') {
      var marque = lire(octets, 8, 4);
      if (MARQUES_HEIF.indexOf(marque) >= 0) return { ext: 'heic', mime: 'image/heic', heic: true };
      if (marque === 'avif' || marque === 'avis') return { ext: 'avif', mime: 'image/avif' };
    }
    return null;
  }

  /* 3 Mo de décodeur, chargés une seule fois et seulement pour qui dépose
     vraiment une photo d'iPhone depuis un navigateur qui ne sait pas la lire.
     L'empreinte interdit au CDN de servir autre chose que cette version. */
  var promesseDecodeur = null;
  function chargerDecodeur() {
    if (promesseDecodeur) return promesseDecodeur;
    promesseDecodeur = new Promise(function (resoudre, rejeter) {
      if (window.HeicTo) return resoudre(window.HeicTo);
      var balise = document.createElement('script');
      balise.src = DECODEUR;
      balise.integrity = DECODEUR_SIGNATURE;
      balise.crossOrigin = 'anonymous';
      balise.onload = function () {
        window.HeicTo ? resoudre(window.HeicTo) : rejeter(new Error('décodeur absent'));
      };
      balise.onerror = function () { rejeter(new Error('décodeur injoignable')); };
      document.head.appendChild(balise);
    });
    return promesseDecodeur;
  }

  function dessiner(bmp) {
    var cote = 1600, ratio = Math.min(1, cote / Math.max(bmp.width, bmp.height));
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(bmp.width * ratio));
    c.height = Math.max(1, Math.round(bmp.height * ratio));
    var ctx = c.getContext('2d');
    if (!ctx) return Promise.reject(new Error('canvas indisponible'));
    ctx.drawImage(bmp, 0, 0, c.width, c.height);
    if (bmp.close) bmp.close();
    return new Promise(function (resoudre, rejeter) {
      c.toBlob(function (blob) {
        blob ? resoudre(new File([blob], 'photo.jpg', { type: 'image/jpeg' }))
             : rejeter(new Error('encodage impossible'));
      }, 'image/jpeg', 0.86);
    });
  }

  /* Réduit la photo, et convertit le HEIC au passage. Si rien n'y parvient,
     on renvoie le fichier d'origine : une candidature ne se perd pas pour
     un format. */
  function preparer(fichier, format) {
    var heic = !!(format && format.heic);
    if (!heic && fichier.size < 900 * 1024) return Promise.resolve(fichier);
    if (!window.createImageBitmap) return Promise.resolve(fichier);

    return createImageBitmap(fichier)
      .catch(function (err) {
        // Sur iPhone, le navigateur a déjà su lire le HEIC. Ailleurs, non.
        if (!heic) throw err;
        return chargerDecodeur().then(function (HeicTo) {
          return HeicTo({ blob: fichier, type: 'bitmap' });
        });
      })
      .then(dessiner)
      .then(function (jpeg) {
        return !heic && jpeg.size >= fichier.size ? fichier : jpeg;
      })
      .catch(function () { return fichier; });
  }

  function ajouterPhotos(liste) {
    var max = 3, place = max - valeurs.photos.length;
    Array.prototype.slice.call(liste, 0, place).forEach(function (fichier) {
      /* La limite des 8 Mo s'applique à ce qui part, pas à ce qui est
         choisi : une photo d'iPhone de 12 Mo devient un JPEG de 400 Ko. */
      if (fichier.size > 30 * 1024 * 1024) {
        alerte = 'Fichier trop lourd (30 Mo maximum).';
        rendre();
        return;
      }

      var entree = { cle: String(Date.now()) + Math.random(), apercu: URL.createObjectURL(fichier),
                     statut: 'attente', fichier: fichier, ext: 'jpg', mime: 'image/jpeg' };
      valeurs.photos.push(entree);
      rendre();

      signature(fichier).then(function (octets) {
        var format = formatDe(octets);
        if (!format) {
          URL.revokeObjectURL(entree.apercu);
          valeurs.photos = valeurs.photos.filter(function (p) { return p.cle !== entree.cle; });
          alerte = 'Format accepté : JPG, PNG, WEBP ou HEIC (photo d’iPhone).';
          rendre();
          return;
        }

        return preparer(fichier, format).then(function (pret) {
          if (pret.size > 8 * 1024 * 1024) {
            URL.revokeObjectURL(entree.apercu);
            valeurs.photos = valeurs.photos.filter(function (p) { return p.cle !== entree.cle; });
            alerte = 'Photo trop lourde (8 Mo maximum).';
            rendre();
            return;
          }
          entree.fichier = pret;
          if (pret !== fichier) {
            // La vignette montrait le fichier d'origine : hors de Safari, un
            // HEIC n'y apparaît pas. On la remplace par la version convertie.
            URL.revokeObjectURL(entree.apercu);
            entree.apercu = URL.createObjectURL(pret);
            entree.ext = 'jpg';
            entree.mime = 'image/jpeg';
          } else {
            entree.ext = format.ext;
            entree.mime = format.mime;
          }
          entree.statut = 'prete';
          rendre();
        });
      });
    });
  }

  /* ---------------- Envoi ---------------- */
  function entetes(extra) {
    var h = { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY };
    Object.keys(extra || {}).forEach(function (k) { h[k] = extra[k]; });
    return h;
  }

  // Une étape qui porte une mention remplace la case à cocher : l'envoi vaut
  // acceptation. On en garde la trace dans consent_at.
  var CONSENTEMENT_IMPLICITE = etapes.some(function (e) { return Boolean(e.mention); });

  function versLigne(id) {
    var v = valeurs;
    var ligne = {
      id: id,
      gender: v.gender,
      first_name: (v.firstName || '').trim(),
      last_name: (v.lastName || '').trim(),
      email: (v.email || '').trim().toLowerCase(),
      // L'envoi vaut acceptation quand une mention le dit ; sinon c'est la
      // case cochée. La validation garantit que l'un des deux est vrai.
      consent_at: (CONSENTEMENT_IMPLICITE || v.consent === true) ? new Date().toISOString() : null,
      status: 'nouveau',
      form_version: PARCOURS,
      source: 'wordpress-autonome'
    };
    if (PARCOURS === 'complet') {
      ligne.city = (v.city || '').trim();
      ligne.postal_code = (v.postalCode || '').trim();
      ligne.orientation = v.orientation;
      ligne.has_children = v.hasChildren === 'oui';
      ligne.looking_for = v.lookingFor;
      ligne.height_cm = Number(v.heightCm);
      ligne.about = (v.about || '').trim();
      ligne.motivation = (v.motivation || '').trim();
      ligne.interests = v.interests || [];
      ligne.interests_other = (v.interestsOther || '').trim() || null;
      ligne.zodiac = v.zodiac || null;
      ligne.profession = (v.profession || '').trim();
      ligne.instagram = (v.instagram || '').trim()
        ? '@' + v.instagram.trim().replace(/^https?:\/\/(www\.)?instagram\.com\//i, '').replace(/\/+$/, '').replace(/^@/, '').split(/[/?]/)[0]
        : null;
      ligne.comes_with = v.comesWith === 'oui';
      ligne.companion_first_name = (v.companionFirstName || '').trim() || null;
      ligne.companion_email = v.comesWith === 'oui' ? ((v.companionEmail || '').trim() || null) : null;
      ligne.referral = v.referral;
      ligne.phone = (v.phone || '').replace(/[^\d+]/g, '').replace(/^0(\d{9})$/, '+33$1');
      ligne.birth_date = v.birthDate;
    }
    return ligne;
  }

  function envoyer() {
    var derniere = etapes[etapes.length - 1];
    erreurs = validerEtape(derniere);
    if (Object.keys(erreurs).length) return rendre();

    // Champ piège rempli : un robot. On remercie sans rien enregistrer.
    var attrape = PIEGES.some(function (nom) { return (valeurs[nom] || '').length > 0; });
    if (attrape) {
      termine = { prenom: valeurs.firstName || '', deja: false };
      return rendre();
    }

    if (SUPABASE_ANON_KEY.indexOf('COLLE_ICI') === 0) {
      alerte = 'Le formulaire n’est pas encore configuré (clé Supabase manquante).';
      return rendre();
    }

    envoiEnCours = true; alerte = null; rendre();

    var id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
      : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
          var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
        });

    // 1. la candidature, 2. les fichiers, 3. le lien vers les fichiers.
    fetch(SUPABASE_URL.replace(/\/+$/, '') + '/rest/v1/lil_members', {
      method: 'POST',
      headers: entetes({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }),
      body: JSON.stringify(versLigne(id))
    }).then(function (r) {
      if (r.status === 409) { termine = { prenom: valeurs.firstName || '', deja: true }; rendre(); return null; }
      if (!r.ok) return r.text().then(function (t) { throw new Error('enregistrement refusé (' + r.status + ') ' + t.slice(0, 160)); });
      return deposerPhotos(id);
    }).then(function (suite) {
      if (suite === null) return;
      try { localStorage.removeItem(CLE_BROUILLON); } catch (e) {}
      termine = { prenom: valeurs.firstName || '', deja: false };
      rendre();
    }).catch(function (err) {
      envoiEnCours = false;
      alerte = 'On n’a pas réussi à enregistrer ta candidature. Réessaie, ou écris-nous à ' + CONTACT + '.';
      if (window.console) console.error('[Lille in Love]', err);
      rendre();
    });
  }

  function deposerPhotos(id) {
    var base = SUPABASE_URL.replace(/\/+$/, '');
    var pretes = valeurs.photos.filter(function (p) { return p.statut === 'prete'; });
    var lignes = [];

    var chaine = pretes.reduce(function (promesse, photo, i) {
      return promesse.then(function () {
        var chemin = 'candidatures/' + id + '/' + (i + 1) + '.' + photo.ext;
        return fetch(base + '/storage/v1/object/' + BUCKET + '/' + chemin, {
          method: 'POST',
          headers: entetes({ 'Content-Type': photo.mime, 'x-upsert': 'true' }),
          body: photo.fichier
        }).then(function (r) {
          // Une photo perdue ne doit pas faire échouer une candidature valable.
          if (r.ok) lignes.push({ member_id: id, storage_path: chemin, position: i + 1,
                                  mime_type: photo.mime, size_bytes: photo.fichier.size });
          else if (window.console) console.warn('[Lille in Love] photo non déposée', r.status);
        });
      });
    }, Promise.resolve());

    return chaine.then(function () {
      if (!lignes.length) return;
      return fetch(base + '/rest/v1/lil_photos', {
        method: 'POST',
        headers: entetes({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }),
        body: JSON.stringify(lignes)
      });
    });
  }

  /* ---------------- Affichage ---------------- */
  function el(tag, classe, texte) {
    var n = document.createElement(tag);
    if (classe) n.className = classe;
    if (texte !== undefined) n.textContent = texte;
    return n;
  }

  function messageErreur(nom) {
    if (!erreurs[nom]) return null;
    var p = el('p', 'lilx-erreur');
    p.appendChild(el('span', null, '↳'));
    p.appendChild(el('span', null, erreurs[nom]));
    return p;
  }

  function dessinerChamp(champ, surSuite) {
    var bloc = el('div');
    if (champ.label && champ.type !== 'consent') {
      var lab = el('label', 'lilx-label', champ.label);
      lab.htmlFor = 'lilx-' + champ.name;
      if (champ.facultatif) lab.appendChild(el('span', 'lilx-facultatif', '(facultatif)'));
      bloc.appendChild(lab);
    }

    if (champ.type === 'radio') {
      var groupe = el('div', 'lilx-choix');
      (champ.options || []).forEach(function (opt) {
        var b = el('button', 'lilx-opt');
        b.type = 'button'; b.setAttribute('role', 'radio');
        b.setAttribute('aria-checked', valeurs[champ.name] === opt.value ? 'true' : 'false');
        b.appendChild(el('span', 'lilx-puce'));
        b.appendChild(el('span', null, opt.label));
        b.onclick = function () {
          valeurs[champ.name] = opt.value;
          delete erreurs[champ.name];
          sauverBrouillon();
          rendre();
          if (champ.advanceOnSelect) setTimeout(surSuite, 260);
        };
        groupe.appendChild(b);
      });
      bloc.appendChild(groupe);

    } else if (champ.type === 'multi') {
      var pastilles = el('div', 'lilx-pastilles');
      (champ.options || []).forEach(function (opt) {
        var choisi = (valeurs[champ.name] || []).indexOf(opt.value) !== -1;
        var b = el('button', 'lilx-pastille', opt.label);
        b.type = 'button'; b.setAttribute('aria-pressed', choisi ? 'true' : 'false');
        b.onclick = function () {
          var liste = valeurs[champ.name] || [];
          valeurs[champ.name] = choisi ? liste.filter(function (x) { return x !== opt.value; })
                                       : liste.concat([opt.value]);
          delete erreurs[champ.name];
          sauverBrouillon(); rendre();
        };
        pastilles.appendChild(b);
      });
      bloc.appendChild(pastilles);

    } else if (champ.type === 'select') {
      var sel = el('select', 'lilx-saisie');
      sel.id = 'lilx-' + champ.name;
      var vide = el('option', null, champ.placeholder || 'Choisis une réponse');
      vide.value = '';
      sel.appendChild(vide);
      (champ.options || []).forEach(function (opt) {
        var o = el('option', null, opt.label); o.value = opt.value;
        if (valeurs[champ.name] === opt.value) o.selected = true;
        sel.appendChild(o);
      });
      if (erreurs[champ.name]) sel.setAttribute('aria-invalid', 'true');
      sel.onchange = function () { valeurs[champ.name] = sel.value; delete erreurs[champ.name]; sauverBrouillon(); };
      bloc.appendChild(sel);

    } else if (champ.type === 'consent') {
      var lab2 = el('label', 'lilx-consent');
      var case_ = document.createElement('input');
      case_.type = 'checkbox'; case_.checked = valeurs[champ.name] === true;
      case_.onchange = function () { valeurs[champ.name] = case_.checked; delete erreurs[champ.name]; sauverBrouillon(); };
      var txt = el('span');
      txt.innerHTML = champ.label || '';
      lab2.appendChild(case_); lab2.appendChild(txt);
      bloc.appendChild(lab2);

    } else if (champ.type === 'photos') {
      bloc.appendChild(zonePhotos());

    } else if (champ.type === 'textarea') {
      var ta = el('textarea', 'lilx-saisie');
      ta.id = 'lilx-' + champ.name;
      ta.placeholder = champ.placeholder || '';
      ta.value = valeurs[champ.name] || '';
      if (champ.maxLength) ta.maxLength = champ.maxLength;
      if (erreurs[champ.name]) ta.setAttribute('aria-invalid', 'true');
      ta.oninput = function () { valeurs[champ.name] = ta.value; delete erreurs[champ.name]; sauverBrouillon(); maj(); };
      bloc.appendChild(ta);
      if (champ.maxLength) {
        var c = el('span', 'lilx-compteur');
        var maj = function () {
          var n = (valeurs[champ.name] || '').length;
          c.textContent = n >= champ.maxLength * 0.7 ? n + ' / ' + champ.maxLength : '';
        };
        maj();
        bloc.appendChild(c);
      }

    } else {
      var inp = document.createElement('input');
      inp.className = 'lilx-saisie';
      inp.id = 'lilx-' + champ.name;
      inp.type = champ.type === 'date' ? 'date' : champ.type === 'email' ? 'email'
               : champ.type === 'tel' ? 'tel' : 'text';
      if (champ.type === 'date') {
        inp.max = new Date(Date.now() - 18 * 365.25 * 864e5).toISOString().slice(0, 10);
        inp.min = '1925-01-01';
      }
      if (champ.inputMode) inp.inputMode = champ.inputMode;
      if (champ.autoComplete) inp.autocomplete = champ.autoComplete;
      if (champ.maxLength) inp.maxLength = champ.maxLength;
      inp.placeholder = champ.placeholder || '';
      inp.value = valeurs[champ.name] || '';
      if (erreurs[champ.name]) inp.setAttribute('aria-invalid', 'true');
      inp.oninput = function () {
        valeurs[champ.name] = champ.type === 'number' ? inp.value.replace(/[^\d]/g, '') : inp.value;
        if (champ.type === 'number') inp.value = valeurs[champ.name];
        delete erreurs[champ.name];
        sauverBrouillon();
      };
      bloc.appendChild(inp);
    }

    if (champ.help) bloc.appendChild(el('p', 'lilx-sous', champ.help));
    var err = messageErreur(champ.name);
    if (err) bloc.appendChild(err);
    return bloc;
  }

  function zonePhotos() {
    var bloc = el('div');
    var entree = document.createElement('input');
    entree.type = 'file'; entree.accept = 'image/*';
    entree.multiple = true; entree.hidden = true;
    entree.onchange = function () { ajouterPhotos(entree.files); entree.value = ''; };

    if (valeurs.photos.length < 3) {
      var zone = el('div', 'lilx-depot');
      zone.setAttribute('role', 'button'); zone.tabIndex = 0;
      zone.appendChild(el('p', 'lilx-depot-titre',
        valeurs.photos.length ? 'Ajouter une autre photo' : 'Choisis tes photos'));
      zone.appendChild(el('p', 'lilx-depot-sous',
        'JPG, PNG ou HEIC — ' + (3 - valeurs.photos.length) + ' restante' + (3 - valeurs.photos.length > 1 ? 's' : '')));
      zone.onclick = function () { entree.click(); };
      zone.onkeydown = function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); entree.click(); } };
      zone.ondragover = function (ev) { ev.preventDefault(); };
      zone.ondrop = function (ev) { ev.preventDefault(); ajouterPhotos(ev.dataTransfer.files); };
      bloc.appendChild(zone);
    }
    bloc.appendChild(entree);

    if (valeurs.photos.length) {
      var grille = el('div', 'lilx-vignettes');
      valeurs.photos.forEach(function (photo) {
        var v = el('div', 'lilx-vignette');
        var img = document.createElement('img');
        img.src = photo.apercu; img.alt = '';
        v.appendChild(img);
        var x = el('button', 'lilx-retirer', '×');
        x.type = 'button'; x.setAttribute('aria-label', 'Retirer cette photo');
        x.onclick = function () {
          URL.revokeObjectURL(photo.apercu);
          valeurs.photos = valeurs.photos.filter(function (p) { return p.cle !== photo.cle; });
          rendre();
        };
        v.appendChild(x);
        grille.appendChild(v);
      });
      bloc.appendChild(grille);
    }
    return bloc;
  }

  function ecranFin() {
    var carte = el('div', 'lilx-carte');
    var fin = el('div', 'lilx-fin lilx-etape');
    var sceau = el('div', 'lilx-sceau');
    sceau.innerHTML = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
      '<path d="M4 12.5l5 5L20 6.5" stroke="#A8946E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    fin.appendChild(sceau);

    if (termine.deja) {
      fin.appendChild(el('h2', 'lilx-fin-titre', 'On t’a déjà, ' + termine.prenom));
      fin.appendChild(el('p', 'lilx-fin-texte',
        'Tu as déjà rempli le questionnaire avec cet email — pas besoin de recommencer. Ta candidature est bien dans nos mains.'));
    } else {
      fin.appendChild(el('h2', 'lilx-fin-titre', 'C’est envoyé, ' + termine.prenom));
      fin.appendChild(el('p', 'lilx-fin-texte',
        'Chez nous, pas d’algorithme : on lit chaque profil à la main. C’est plus lent, mais c’est exactement ce qui fait que les soirées se passent bien.'));
      fin.appendChild(el('p', 'lilx-fin-texte',
        'On revient vers toi très vite, par email. D’ici là, tu n’as rien à faire.'));
    }

    var note = el('p', 'lilx-fin-note');
    note.appendChild(el('span', null, 'Une question ? Écris-nous à '));
    var lien = el('a', null, CONTACT);
    lien.href = 'mailto:' + CONTACT;
    note.appendChild(lien);
    fin.appendChild(note);

    carte.appendChild(fin);
    return carte;
  }

  function rendre() {
    racine.innerHTML = '';
    if (termine) { racine.appendChild(ecranFin()); return; }

    var etape = etapes[index];
    var derniere = index === etapes.length - 1;
    var form = el('form', 'lilx-carte');
    form.noValidate = true;
    form.onsubmit = function (ev) { ev.preventDefault(); derniere ? envoyer() : suivante(); };

    var progres = el('div', 'lilx-progres');
    var piste = el('div', 'lilx-piste');
    var barre = el('div', 'lilx-barre');
    barre.style.width = Math.max(Math.round((index / etapes.length) * 100), 4) + '%';
    piste.appendChild(barre);
    progres.appendChild(piste);
    progres.appendChild(el('span', 'lilx-compte', (index + 1) + ' / ' + etapes.length));
    form.appendChild(progres);

    if (alerte) form.appendChild(el('div', 'lilx-alerte', alerte));

    var bloc = el('div', 'lilx-etape');
    if (etape.section) bloc.appendChild(el('p', 'lilx-section', etape.section));
    var titre = el('h2', 'lilx-question', (etape.number ? etape.number + '. ' : '') + etape.title);
    if (etape.facultatif) titre.appendChild(el('span', 'lilx-facultatif', '(facultatif)'));
    bloc.appendChild(titre);
    if (etape.help) bloc.appendChild(el('p', 'lilx-aide', etape.help));
    if (etape.note) bloc.appendChild(el('p', 'lilx-note', etape.note));

    var champs = el('div', 'lilx-champs');
    etape.fields.filter(visible).forEach(function (champ) {
      champs.appendChild(dessinerChamp(champ, suivante));
    });
    bloc.appendChild(champs);
    form.appendChild(bloc);

    var pieges = el('div', 'lilx-piege');
    pieges.setAttribute('aria-hidden', 'true');
    PIEGES.forEach(function (nom) {
      var i = document.createElement('input');
      i.type = 'text'; i.tabIndex = -1; i.autocomplete = 'off'; i.name = nom;
      i.value = valeurs[nom] || '';
      i.oninput = function () { valeurs[nom] = i.value; };
      pieges.appendChild(i);
    });
    form.appendChild(pieges);

    var nav = el('div', 'lilx-nav');
    if (index > 0) {
      var retour = el('button', 'lilx-btn lilx-discret', 'Précédent');
      retour.type = 'button';
      retour.onclick = function () { erreurs = {}; index -= 1; sauverBrouillon(); rendre(); };
      nav.appendChild(retour);
    }
    var principal = el('button', 'lilx-btn lilx-principal',
      envoiEnCours ? 'Envoi…' : (derniere ? 'Envoyer ma candidature' : 'Suivant'));
    principal.type = 'submit';
    principal.disabled = envoiEnCours;
    nav.appendChild(principal);
    form.appendChild(nav);

    if (etape.mention) {
      var mention = el('p', 'lilx-mention');
      // Le texte vient du questionnaire, pas d'une saisie : on peut le poser tel quel.
      mention.innerHTML = etape.mention;
      form.appendChild(mention);
    }

    racine.appendChild(form);
  }

  function suivante() {
    erreurs = validerEtape(etapes[index]);
    if (Object.keys(erreurs).length) return rendre();
    index = Math.min(etapes.length - 1, index + 1);
    sauverBrouillon();
    rendre();
  }

  rendre();
})();
</script>
